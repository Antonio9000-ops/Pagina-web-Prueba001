<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Principal</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body
    class="cursor-none bg-[url('https://i.ibb.co/bR21VW4p/image.png')] bg-no-repeat bg-cover min-h-screen bg-fixed"
  >
    <nav
      class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-5xl bg-blue-900 rounded-lg p-3"
    >
      <div class="flex items-center justify-between">
        <span class="text-white text-lg ms-4">Mi logo</span>

        <ul class="flex items-center gap-8 text-white me-4">
          <li>
            <p>Hola</p>
          </li>
          <li>
            <p>Saludo</p>
          </li>
        </ul>
      </div>
    </nav>
    <img
      id="cursor"
      src="https://i.ibb.co/kVWLBjb2/pngwing-com-1.png"
      class="fixed top-0 left-0 w-10 h-10 pointer-events-none z-50 select-none"
      alt=""
    />
    <div class="flex justify-center p-10">
      <h1 class="titulos border text-center text-5xl text-white mt-10">
        Bienvenidos
      </h1>
    </div>
    <div class="flex mt-28 gap-4 p-4 items-stretch">
      <!-- Tarjeta 1 -->
      <div class="flex-1 bg-green-800 p-8 flex flex-col rounded-lg text-white">
        <!-- Contenido -->
        <div class="flex-1 flex items-center justify-center gap-3">
          <img
            id="cursore"
            src="https://i.ibb.co/zWfgQMJS/pngwing-com-2.png"
            class="object-contain w-40 h-60"
            alt=""
          />

          <div class="flex flex-col">
            <h2 class="mt-3 bg-green-900">Nombre : Usuario</h2>
            <h2 class="mt-2 bg-green-900">Apellido : Usuario</h2>
            <h2 class="mt-2 bg-green-900">Usuario : Usuario</h2>
          </div>
        </div>

        <!-- Botón -->
        <button
          id="boton"
          class="text-center border-black bg-blue-500 border-4 mt-4 self-center text-slate-100 px-4 py-2 cursor-none"
        >
          Ver datos
        </button>
      </div>

      <!-- Tarjeta 2 -->
      <div class="flex-1 bg-green-800 p-8 flex flex-col rounded-lg text-white">
        <!-- Contenido -->
        <div class="flex-1 flex flex-col items-center justify-center">
          <h2 class="bg-green-900 mb-4">Imagen</h2>

          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/054/659/403/small/a-vibrant-and-colorful-minecraft-landscape-adorned-with-adorable-bunnies-and-beautiful-flowers-photo.jpg"
            alt="Imagen de Minecraft"
            class="object-contain"
          />
        </div>

        <!-- Botón -->
        <button
          id="botonRegreso"
          class="bg-green-900 border-2 border-green-500 mt-4 self-center text-white px-4 py-2 cursor-none"
        >
          Titulo original
        </button>
      </div>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
