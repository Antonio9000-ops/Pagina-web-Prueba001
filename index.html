<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Principal</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body
    class="cursor-none bg-[url('https://i.ibb.co/bR21VW4p/image.png')] bg-no-repeat bg-cover min-h-screen bg-fixed"
  >
    <nav
      class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-5xl bg-blue-900 rounded-lg p-3"
    >
      <div class="flex items-center justify-between">
        <span class="text-white text-lg ms-4">Mi logo</span>

        <ul class="flex items-center gap-8 text-white me-4">
          <li>
            <p>Hola</p>
          </li>
          <li>
            <p>Saludo</p>
          </li>
        </ul>
      </div>
    </nav>
    <img
      id="cursor"
      src="https://i.ibb.co/kVWLBjb2/pngwing-com-1.png"
      class="fixed top-0 left-0 w-10 h-10 pointer-events-none z-50 select-none"
      alt=""
    />
    <div class="flex justify-center p-10">
      <h1 class="titulos border text-center text-5xl text-white mt-10">
        Bienvenidos
      </h1>
    </div>
    <div class="flex mt-28 gap-4 p-4">


    <!-- contenedor 1 -->
    <div class="w-full max-w-md h-fit bg-green-800 p-4 flex flex-col rounded-lg text-white shadow-lg">
      
      <!-- Encabezado -->
      <div class="bg-green-950/40 border border-green-700/30 rounded px-3 py-1 text-center font-bold text-sm"> 
        Datos del Usuario 
      </div>

      <!-- Contenido principal -->
      <div class="bg-green-950/20 border border-green-700/30 rounded p-3 mt-3 flex items-center gap-3">
        <!-- imageen de la skin -->
        <img src="/images/skin.png" alt="Imagen de Usuario" class="w-24 h-32 rounded-lg object-cover flex-shrink-0">
        
        <!-- datos del usuarios -->
        <div class="flex flex-col gap-2 text-sm w-full">
          <p class="bg-green-950/60 border border-green-700/20 rounded px-3 py-1.5">
            <span class="font-semibold text-green-300">Nombre:</span> Tuna
          </p>
          <p class="bg-green-950/60 border border-green-700/20 rounded px-3 py-1.5">
            <span class="font-semibold text-green-300">Tipo:</span> Jugador
          </p>
          <p class="bg-green-950/60 border border-green-700/20 rounded px-3 py-1.5">
            <span class="font-semibold text-green-300">Rango:</span> Básico
          </p>
        </div>
      </div>

      <!-- botón reactivo -->
      <button id="boton" class="mt-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-1.5 px-5 rounded self-center cursor-pointer transition-colors shadow-md text-sm">
        Ver datos
      </button>

    </div>
    <!-- fin del contenedor 1 -->
      

    <!-- contenedor 2 -->
    <div class="flex-1 bg-green-800 p-4 flex flex-col rounded-lg text-white">
      <div class="bg-green-950/40 border border-green-700/30 rounded px-3 py-1.5 text-center font-bold"> Imagen Referencial </div>
      <div class="rounded p-4 mt-2 flex items-center gap-4">
          <!-- imagen del paisaje-->
          <img src="https://static.vecteezy.com/system/resources/thumbnails/054/659/403/small/a-vibrant-and-colorful-minecraft-landscape-adorned-with-adorable-bunnies-and-beautiful-flowers-photo.jpg" 
          alt="Imagen de Usuario" class="rounded-lg flex items-center justify-center w-full max-h-100">
      </div>
      <!-- boton reactivo del contenedor 2 -->
      <button id="botonRegreso" class="bg-green-900 border-2 border-green-500 mt-8 self-center text-white px-4 py-2 cursor-none rounded">
          Titulo orignal
      </button>
    </div>
    <!-- fin del contenedor 2 -->

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
