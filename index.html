<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Principal</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body class="cursor-none bg-no-repeat bg-center bg-cover min-h-screen">
    <div
      class="fixed inset-0 -z-10 bg-[url('/images/image-1.png')] bg-cover bg-center bg-no-repeat opacity-90"
    ></div>

    <div class="p-3">
      <nav class="fixed top-3 w-full px-16">
        <div
          class="flex items-center justify-between bg-blue-900 rounded-lg p-2 px-16"
        >
          <img src="/images/logo.png" class="h-10 w-10" />
          <span class="text-white text-2xl ms-2">Craft</span>
          <div class="flex justify-end items-center flex-1 me-4">
            <ul class="flex gap-4 text-white mr-16">
              <li>
                <p class="text-2xl">Inicio</p>
              </li>
              <li>
                <p class="text-2xl">Imagenes</p>
              </li>
            </ul>
            <button id="login" class="text-white text-2xl">
              Iniciar sesion
            </button>
          </div>
        </div>
      </nav>
    </div>

    <img
      id="cursor"
      src="https://i.ibb.co/kVWLBjb2/pngwing-com-1.png"
      class="fixed top-0 left-0 w-10 h-10 pointer-events-none z-50 select-none"
      alt=""
    />
    <div class="flex flex-col justify-center items-center p-10 gap-2">
      <h1 class="titulos text-center text-4xl text-red-900 mt-10 font-bold">
        Bienvenido "Usuario"
      </h1>
      <p
        class="text-slate-100 text-8xl font-medium drop-shadow text-stoke bg-green-700 rounded-full p-3 font-serif"
      >
        Craft World
      </p>
    </div>
    <!-- Tarjeta padre-->
    <div class="flex mt-16 gap-4 p-4 items-stretch flex-1">
      <!--Contenedor 1-->
      <div class="flex flex-1 flex-col gap-3 p-5 items-center">
        <!-- Tarjeta 1 -->
        <div
          class="p-3 flex flex-col rounded-lg text-white flex-1 items-center justify-center w-full"
        >
          <!-- Contenido -->
          <div class="flex items-center justify-center gap-3 w-auto">
            <img
              id="cursore"
              src="https://i.ibb.co/zWfgQMJS/pngwing-com-2.png"
              class="object-contain w-80 h-auto"
              alt=""
            />

            <div
              class="flex flex-col h-full items-center justify-center w-full p-3"
            >
              <h2 id="nombre" class="mt-3 bg-black text-3xl">
                Nombre : Usuario
              </h2>
              <h2 id="apellido" class="mt-2 bg-black text-3xl">
                Apellido : Usuario
              </h2>
              <h2 id="usuario" class="mt-2 bg-black text-3xl">
                Usuario : Usuario
              </h2>
            </div>
          </div>

          <!-- Botón -->
        </div>
        <!--Div boton-->
        <div class="bg-black p-3 justify-center items-center mt-auto">
          <button id="boton" class="self-center text-white cursor-none text-xl">
            Ver datos
          </button>
        </div>
      </div>
      <!--contenedor 2-->
      <!-- Tarjeta 2 -->
      <div
        class="flex-1 p-6 flex flex-col rounded-lg text-white items-center justify-center gap-4"
      >
        <!-- Contenido -->
        <div
          class="flex-1 flex flex-col items-center justify-center p-8 rounded-lg w-full"
        >
          <h2 class="bg-black mb-4 text-2xl">Mobs</h2>

          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/054/659/403/small/a-vibrant-and-colorful-minecraft-landscape-adorned-with-adorable-bunnies-and-beautiful-flowers-photo.jpg"
            alt="Imagen de Minecraft"
            class="object-contain h-auto border-green-700 border-8"
          />
        </div>
        <!--Div boton2-->
        <div class="bg-black p-3 justify-center items-center mt-auto">
          <!-- Botón -->
          <button
            id="botonRegreso"
            class="self-center text-white cursor-none text-xl"
          >
            Más Mobs
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
